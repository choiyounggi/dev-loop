# Run the bats suite on every push to main and every PR, across macOS and Linux
# (the plugin's shell scripts must be portable — design §12). Guards against
# regressions before a release tag is cut.

name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats + jq + tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install bash bats-core jq tmux
          else
            sudo apt-get update
            sudo apt-get install -y bats jq tmux
          fi

      # Mechanical wiki gates, surfaced as their own step so a wiki defect is
      # named in the CI summary instead of buried in the bats run (both are
      # also covered by bats live-corpus tests; node is preinstalled on
      # GitHub runners).
      - name: Wiki checks (structure + duplicates + prohibitions)
        run: |
          node scripts/wiki-structure-checks.js wiki
          node scripts/wiki-lint-prohibitions.js wiki

      - name: Run bats suite
        run: bats tests/

      - name: Negative control — mid-test assertion canary (must fail)
        run: |
          if bats tests/canary/mid-test-assertion-canary.bats; then
            echo "::error::canary passed — mid-test [[ ]] failures are being masked (issue #114)"
            exit 1
          fi
